name: Import Chic & Co site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download current public site
        env:
          SITE_URL: https://miniature-header-refuse-whom.trycloudflare.com
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL "$SITE_URL/index.html" -o index.html
          curl -fsSL "$SITE_URL/styles.css" -o styles.css
          curl -fsSL "$SITE_URL/app.js" -o app.js
          curl -fsSL "$SITE_URL/assets/chic-co-logo.svg" -o assets/chic-co-logo.svg
          curl -fsSL "$SITE_URL/assets/chic-co-watermark.svg" -o assets/chic-co-watermark.svg
          curl -fsSL "$SITE_URL/assets/chic-co-logo-black.png" -o assets/chic-co-logo-black.png
          curl -fsSL "$SITE_URL/assets/chic-co-watermark.png" -o assets/chic-co-watermark.png
          cat > README.md <<'EOF'
          # Chic & Co

          Aplicacion web estatica para administrar el salon de belleza Chic & Co.

          ## Modulos

          - Clientes
          - Inventario
          - Procedimientos
          - En curso
          - Planes
          - Citas y agenda
          - Usuarios y permisos
          - Facturacion
          - Sucursales con datos separados

          ## Nota importante

          Esta version usa localStorage como base de datos demo y autenticacion del lado del navegador. Es adecuada para demostraciones y prototipos, pero no debe usarse como sistema real de seguridad o almacenamiento de datos sensibles sin un backend.
          EOF
          cat > .gitignore <<'EOF'
          *.log
          .env
          node_modules/
          cloudflared.exe
          Thumbs.db
          .DS_Store
          EOF
          git rm --ignore-unmatch .github/workflows/import-site.yml

      - name: Commit imported site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js assets README.md .gitignore .github || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Chic & Co static web app"
            git push
          fi
