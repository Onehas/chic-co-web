<svg width="1600" height="1200" viewBox="0 0 1600 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6dcae" />
      <stop offset="0.25" stop-color="#b8874d" />
      <stop offset="0.52" stop-color="#ffe3b0" />
      <stop offset="0.78" stop-color="#9e6936" />
      <stop offset="1" stop-color="#d9b16d" />
    </linearGradient>
    <filter id="texture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="12" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0.25" />
      <feBlend in="SourceGraphic" mode="multiply" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="#030303" />
  <g filter="url(#softShadow)">
    <g filter="url(#texture)" fill="url(#gold)" text-anchor="middle">
      <text x="800" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="250" font-weight="400" letter-spacing="-28">C C</text>
      <circle cx="800" cy="500" r="68" fill="#030303" stroke="url(#gold)" stroke-width="16" />
      <text x="800" y="526" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="url(#gold)">&amp;</text>
      <text x="800" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="164" font-weight="400" letter-spacing="34">CHIC &amp; CO</text>
    </g>
  </g>
</svg>
