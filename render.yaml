databases:
  - name: chic-co-db
    plan: basic-1gb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    databaseName: chic_co
    user: chic_co

services:
  - type: web
    name: chic-co-web
    runtime: node
    plan: free
    buildCommand: node scripts/clean-production.mjs && npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: chic-co-db
          property: connectionString
