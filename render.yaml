databases:
  - name: chic-co-db
    plan: basic-1gb
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    databaseName: chic_co
    user: chic_co

services:
  - type: web
    name: chic-co-web
    runtime: node
    plan: free
    buildCommand: node scripts/clean-production.mjs && npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: chic-co-db
          property: connectionString
      # Se definen en el panel de Render, nunca en el repositorio.
      # Sin las dos primeras, una base de datos nueva queda sin super usuario.
      - key: CHIC_BOOTSTRAP_EMAIL
        sync: false
      - key: CHIC_BOOTSTRAP_PASSWORD
        sync: false
      - key: CHIC_RECEPCION_PASSWORD_HASH
        sync: false
      - key: CHIC_MONICA_PASSWORD_HASH
        sync: false
      # Cifra los secretos fiscales (.p12, PIN, contrasena ATV). Minimo 24 caracteres.
      - key: HACIENDA_SECRET_KEY
        sync: false
      # Cuantos proxys propios hay delante. En Render es 1. Sin ella, el limite
      # de intentos de login cuenta por cuenta en vez de por visitante.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Correo transaccional (Resend). Sin las dos primeras no se envia nada,
      # pero la aplicacion funciona igual.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: CHIC_STAFF_EMAILS
        sync: false
      # Protege la ruta que dispara el reporte de cierre desde un Cron Job.
      - key: CHIC_REPORT_SECRET
        sync: false
      # Facturacion electronica con Alegra. Sin estas dos, el envio a Alegra
      # queda apagado y el resto del sistema funciona igual.
      - key: ALEGRA_EMAIL
        sync: false
      - key: ALEGRA_TOKEN
        sync: false
