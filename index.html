<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chic & Co Salon Software</title>
    <link rel="icon" href="assets/chic-co-logo-black.png" />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Se aplica antes de pintar: si esperara a app.js, quien tiene el tema
      // oscuro elegido veria un destello blanco en cada carga.
      (() => {
        try {
          const saved = localStorage.getItem("chic-co-theme");
          if (saved === "dark" || saved === "light") {
            document.documentElement.dataset.theme = saved;
          }
        } catch (error) {
          /* modo privado sin almacenamiento: se queda con el tema del sistema */
        }
      })();
    </script>
  </head>
  <body class="is-login">
    <section class="login-screen" id="loginScreen" aria-labelledby="loginTitle">
      <div class="login-panel">
        <div class="login-brand">
          <div class="login-logo-frame">
            <img src="assets/chic-co-logo-black.png" alt="Chic & Co" />
          </div>
          <div>
            <p class="eyebrow" data-brand-name>Chic & Co</p>
            <h1 id="loginTitle">Acceso interno</h1>
          </div>
        </div>

        <form class="login-form" id="loginForm" autocomplete="off">
          <label class="field">
            <span>Email</span>
            <input id="loginEmail" name="email" type="email" autocomplete="username" placeholder="correo@dominio.com" required />
          </label>

          <label class="field">
            <span>Contrasena</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
          </label>

          <p class="login-error" id="loginError" role="alert"></p>
          <button class="primary-action" type="submit" id="loginSubmit">Entrar</button>
        </form>
      </div>
    </section>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">C&C</div>
        <div class="brand-copy">
          <strong>Chic & Co</strong>
          <span>Salon Suite</span>
        </div>
      </div>

      <nav class="main-nav" aria-label="Navegacion principal">
        <button class="nav-link" type="button" data-menu="sucursal" aria-haspopup="menu" aria-expanded="false" aria-controls="dropdownLayer">
          <span class="branch-dot" aria-hidden="true"></span>
          <span id="currentBranchName">Sucursal</span>
          <span class="chevron">v</span>
        </button>
      </nav>

      <div class="top-actions">
        <button
          class="icon-button"
          type="button"
          id="themeToggle"
          aria-label="Cambiar tema"
          title="Tema: automatico"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" class="theme-icon-auto">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none" />
          </svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="theme-icon-light">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
          </svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="theme-icon-dark">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
          </svg>
        </button>
        <button class="icon-button" type="button" data-quick="sync" aria-label="Sincronizar ahora" title="Sincronizar ahora">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6v5h-5" />
            <path d="M4 18v-5h5" />
            <path d="M6.5 9A6 6 0 0 1 17 6.6L20 11" />
            <path d="M17.5 15A6 6 0 0 1 7 17.4L4 13" />
          </svg>
        </button>
        <button class="user-menu" type="button" data-menu="usuario" aria-haspopup="menu" aria-expanded="false" aria-controls="dropdownLayer">
          <span id="currentUserName">Usuario</span>
          <span class="chevron">v</span>
        </button>
      </div>
    </header>

    <div class="dropdown-layer" id="dropdownLayer"></div>

    <main class="app-shell">

        <section class="sidebar-brand">
          <img src="assets/chic-co-logo-black.png" alt="Chic & Co" />
          <div>
            <p class="eyebrow">Software interno</p>
            <h1>Administracion del salon</h1>
          </div>
        </section>

        <nav class="module-grid" aria-label="Opciones principales">

              </svg>
            </span>

            </span>
          </button>

          <button class="module-button is-hidden" type="button" data-module="integraciones">
            <span class="module-icon">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <rect x="10" y="10" width="18" height="18" rx="4" />
                <rect x="36" y="10" width="18" height="18" rx="4" />
                <rect x="10" y="36" width="18" height="18" rx="4" />
                <path d="M45 36v8m-4-4h8" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Integraciones</strong>
              <small>Apps conectadas</small>
            </span>
          </button>

          <p class="rail-group">Operacion</p>

          <button class="module-button is-active" type="button" data-module="clientes">

                <circle cx="43" cy="27" r="8" />
                <path d="M37 52c2-8 16-8 18 0" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Clientes</strong>
              <small>Historial y contacto</small>
            </span>
          </button>

          <button class="module-button" type="button" data-module="citas">
            <span class="module-icon">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M16 18h32v34H16z" />
                <path d="M16 27h32" />
                <path d="M24 12v12" />
                <path d="M40 12v12" />
                <path d="M23 36h10" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Citas</strong>
              <small>Agenda del salon</small>
            </span>
          </button>

          <button class="module-button" type="button" data-module="enCurso">
            <span class="module-icon">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="32" cy="32" r="22" />
                <path d="M32 18v14l9 6" />
              </svg>
            </span>
            <span class="module-label">
              <strong>En curso</strong>
              <small>Sesiones activas</small>
            </span>
          </button>

          <p class="rail-group">Catalogo</p>

          <button class="module-button" type="button" data-module="inventario">
            <span class="module-icon">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M14 20 32 10l18 10v25L32 55 14 45z" />
                <path d="M14 20 32 30l18-10" />
                <path d="M32 30v25" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Inventario</strong>
              <small>Productos y stock</small>
            </span>
          </button>

          <button class="module-button" type="button" data-module="procedimientos">
            <span class="module-icon">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M18 46c9-20 24-20 33-30" />
                <path d="M13 52c12-3 20-12 24-25" />
                <path d="M43 15l7-3 2 7" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Procedimientos</strong>
              <small>Servicios esteticos</small>
            </span>
          </button>

          <button class="module-button" type="button" data-module="planes">
            <span class="module-icon">

                <path d="M16 16h32v38H16z" />
                <path d="M16 26h32" />
                <path d="M24 10v12" />
                <path d="M40 10v12" />
                <path d="M23 36h12" />
                <path d="M23 45h18" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Planes</strong>
              <small>Larga duracion</small>
            </span>
          </button>

          <p class="rail-group">Administracion</p>

          <button class="module-button" type="button" data-module="facturacion">
            <span class="module-icon">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <path d="M18 10h28v44l-7-4-7 4-7-4-7 4z" />
                <path d="M26 22h12" />
                <path d="M26 32h12" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Facturacion</strong>
              <small>Clientes, IVA y pagos</small>
            </span>
          </button>

          <button class="module-button" type="button" data-module="usuarios">
            <span class="module-icon">
              <svg viewBox="0 0 64 64" aria-hidden="true">
                <circle cx="24" cy="23" r="9" />
                <path d="M10 51c3-12 25-12 28 0" />
                <path d="M44 21h11" />
                <path d="M44 31h8" />
              </svg>
            </span>
            <span class="module-label">
              <strong>Usuarios</strong>
              <small>Roles y permisos</small>

      </aside>

      <section class="main-stage">
        <section class="module-overview" aria-label="Resumen operativo">
          <section class="info-block active-module-card" aria-labelledby="moduleTitle">
            <div class="module-headline">
              <div>
                <p class="eyebrow">Modulo activo</p>
                <h2 id="moduleTitle">Clientes</h2>
                <p id="moduleDescription"></p>

              <div class="action-row" id="moduleActions"></div>
            </div>
            <div class="metric-row" id="moduleMetrics"></div>
          </section>
        </section>

        <section class="operations-panel" aria-labelledby="moduleTitle">
          <div class="operations-head">
            <div>
              <p class="eyebrow" id="viewEyebrow">Gestion</p>
              <h2 id="viewTitle">Clientes</h2>
              <p id="viewSubtitle"></p>
            </div>
            <div class="toolbar">
              <label class="search-box" for="searchInput">
                <span>Buscar</span>
                <input id="searchInput" type="search" placeholder="Nombre, producto, estado..." />
              </label>
            </div>
          </div>

          <div class="view-content" id="viewContent"></div>

    </main>

    <div class="drawer-scrim" id="drawerScrim"></div>

    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" inert>
      <div class="drawer-head">
        <h2 id="drawerTitle">Nuevo registro</h2>
        <button class="drawer-close" type="button" id="drawerClose" aria-label="Cerrar panel">&times;</button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
      <div class="drawer-foot">
        <button class="secondary-action" type="button" id="drawerCancel">Cancelar</button>
        <button class="primary-action" type="button" id="drawerSubmit">Guardar</button>
      </div>
    </aside>

    <div class="photo-viewer" id="photoViewer" role="dialog" aria-modal="true" aria-labelledby="photoViewerCaption" aria-hidden="true">
      <figure>
        <img id="photoViewerImage" alt="" />
        <figcaption>
          <span id="photoViewerCaption"></span>
          <button class="secondary-action" type="button" id="photoViewerClose">Cerrar</button>
        </figcaption>
      </figure>
    </div>

    <div class="modal-backdrop" id="inventoryReasonModal" aria-hidden="true">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reasonModalTitle">
        <form class="data-form" id="inventoryReasonForm" autocomplete="off">
          <div class="modal-head">
            <div>
              <p class="eyebrow">Salida de inventario</p>
              <h2 id="reasonModalTitle">Motivo</h2>
            </div>
            <button class="modal-close" type="button" id="reasonCancelButton" aria-label="Cerrar">&times;</button>
          </div>

          <p class="modal-product" id="reasonProductName"></p>

          <label class="field full">
            <span>Motivo</span>
            <textarea
              id="reasonText"
              name="reason"
              placeholder="Escriba el motivo de uso del producto..."
              required
            ></textarea>
          </label>

          <div class="modal-foot">
            <span id="reasonWordCount">0/100 palabras</span>
            <div class="inline-actions">
              <button class="secondary-action" type="button" id="reasonSecondaryCancelButton">Cancelar</button>
              <button class="primary-action" type="submit">Validar salida</button>
            </div>
          </div>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
    <script src="security-upgrade.js"></script>
    <script src="enhancements.js"></script>
    <script src="agenda-upgrade.js"></script>
    <script src="booking-inbox.js"></script>
    <script src="account-switch.js"></script>
    <script src="branding.js"></script>
    <script src="billing-alegra.js"></script>
    <script src="marketing-pixels.js"></script>
    <script src="data-import.js"></script>
    <script src="integrations.js"></script>
    <script src="production-tools.js"></script>
    <script>
      // Conmutador de tema: automatico -> claro -> oscuro -> automatico.
      // "Automatico" no fija nada y deja mandar a prefers-color-scheme.
      (() => {
        const toggle = document.getElementById("themeToggle");
        if (!toggle) return;

        const order = ["auto", "light", "dark"];
        const labels = { auto: "automatico", light: "claro", dark: "oscuro" };

        function currentTheme() {
          const value = document.documentElement.dataset.theme;
          return order.includes(value) ? value : "auto";
        }

        function applyTheme(theme) {
          if (theme === "auto") delete document.documentElement.dataset.theme;
          else document.documentElement.dataset.theme = theme;
          toggle.dataset.themeState = theme;
          toggle.title = `Tema: ${labels[theme]}`;
          toggle.setAttribute("aria-label", `Cambiar tema (actual: ${labels[theme]})`);
          try {
            if (theme === "auto") localStorage.removeItem("chic-co-theme");
            else localStorage.setItem("chic-co-theme", theme);
          } catch (error) {
            /* sin almacenamiento el cambio dura lo que dure la pestana */
          }
        }

        applyTheme(currentTheme());
        toggle.addEventListener("click", () => {
          applyTheme(order[(order.indexOf(currentTheme()) + 1) % order.length]);
        });
      })();
    </script>

    <script>
      (() => {
        if (window.__chicLogoutMenuGuard || typeof dropdownOptions !== "function") return;
        window.__chicLogoutMenuGuard = true;
        const originalDropdownOptions = dropdownOptions;
        dropdownOptions = function (menuName) {
          const options = originalDropdownOptions(menuName) || [];
          if (menuName !== "usuario" || options.some((item) => item.logout)) {
            return options;
          }
          return [...options, { label: "Cerrar sesion", logout: true }];
        };
      })();
    </script>
  </body>
</html>
