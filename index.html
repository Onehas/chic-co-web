<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chic & Co | Salon Suite</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen" aria-label="Inicio de sesion">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-logo-frame">
            <img src="assets/chic-co-logo.svg" alt="Chic & Co" />
          </div>
          <span>Salon Suite</span>
          <h1>Chic & Co</h1>
        </div>
        <form class="login-form" id="loginForm" autocomplete="on">
          <label class="field">
            <span>Email</span>
            <input id="loginEmail" name="email" type="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Contrasena</span>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
          </label>
          <p class="login-error" id="loginError" role="alert"></p>
          <button class="primary-action" type="submit">Entrar</button>
        </form>
      </div>
    </section>

    <header class="topbar">
      <div class="brand">
        <div class="brand-logo-frame">
          <img src="assets/chic-co-logo.svg" alt="Chic & Co" />
        </div>
        <div class="brand-copy">
          <strong>Chic & Co</strong>
          <span>Salon Suite</span>
        </div>
      </div>

      <nav class="main-nav" aria-label="Menu superior">
        <button class="nav-menu-button" type="button" data-menu="usuario">Usuario v</button>
        <button class="nav-menu-button" type="button" data-menu="sucursal">Sucursal v</button>
        <button class="nav-menu-button" type="button" data-menu="ayuda">Ayuda v</button>
      </nav>

      <div class="top-actions">
        <button class="secondary-action" type="button" id="resetDataButton">Reiniciar demo</button>
      </div>
    </header>

    <main class="app-shell">
      <aside class="sidebar" aria-label="Modulos">
        <section class="user-card">
          <span>Usuario activo</span>
          <strong id="currentUserName">Gabriel Arce</strong>
          <small>Sistema Chic & Co</small>
        </section>

        <section class="module-grid" id="moduleGrid">
          <button class="module-button is-active" type="button" data-module="clientes">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M16 11a4 4 0 1 0-3.6-5.7A5 5 0 0 1 16 11Zm-7 1a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-3.9 0-7 2-7 4.4V21h14v-2.6C16 16 12.9 14 9 14Zm7.5-.5c-.7 0-1.4.1-2 .3 1.8 1 3 2.6 3 4.6V21H22v-2.4c0-2.7-2.5-5.1-5.5-5.1Z" /></svg>
            </span>
            <span>Clientes</span>
          </button>
          <button class="module-button" type="button" data-module="inventario">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M21 7.5 12 2 3 7.5v9L12 22l9-5.5v-9ZM12 4.3l5.9 3.6L12 11.4 6.1 7.9 12 4.3ZM5 9.7l6 3.6v5.9l-6-3.7V9.7Zm8 9.5v-5.9l6-3.6v5.8l-6 3.7Z" /></svg>
            </span>
            <span>Inventario</span>
          </button>
          <button class="module-button" type="button" data-module="procedimientos">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M18.7 3.3a1 1 0 0 0-1.4 0l-3.8 3.8 3.4 3.4 3.8-3.8a1 1 0 0 0 0-1.4l-2-2ZM12.1 8.5 4 16.6V20h3.4l8.1-8.1-3.4-3.4ZM7 3h2v4H7V3Zm8 14h2v4h-2v-4ZM3 7h4v2H3V7Zm14 8h4v2h-4v-2Z" /></svg>
            </span>
            <span>Procedimientos</span>
          </button>
          <button class="module-button" type="button" data-module="enCurso">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M6 3h12v4h3v14H3V7h3V3Zm2 4h8V5H8v2Zm-3 2v10h14V9H5Zm3 2h8v2H8v-2Zm0 4h5v2H8v-2Z" /></svg>
            </span>
            <span>En curso</span>
          </button>
          <button class="module-button" type="button" data-module="planes">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M7 2h2v3h6V2h2v3h3v17H4V5h3V2Zm11 8H6v10h12V10ZM6 7v1h12V7H6Zm2 5h3v3H8v-3Zm5 0h3v3h-3v-3Zm-5 5h3v2H8v-2Z" /></svg>
            </span>
            <span>Planes</span>
          </button>
          <button class="module-button" type="button" data-module="citas">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M7 2h2v2h6V2h2v2h4v18H3V4h4V2Zm12 8H5v10h14V10ZM5 6v2h14V6H5Zm3 7h3v3H8v-3Zm5 0h3v3h-3v-3Z" /></svg>
            </span>
            <span>Citas</span>
          </button>
          <button class="module-button" type="button" data-module="facturacion">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Zm2 3v13.3l1-.7 3 2 3-2 1 .7V5H8Zm2 3h6v2h-6V8Zm0 4h6v2h-6v-2Zm0 4h4v2h-4v-2Z" /></svg>
            </span>
            <span>Facturacion</span>
          </button>
          <button class="module-button" type="button" data-module="usuarios">
            <span class="module-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img"><path d="M12 2a5 5 0 0 0-5 5v2H5v13h14V9h-2V7a5 5 0 0 0-5-5Zm-3 7V7a3 3 0 0 1 6 0v2H9Zm-2 2h10v9H7v-9Zm5 2a2 2 0 0 0-1 3.7V18h2v-1.3A2 2 0 0 0 12 13Z" /></svg>
            </span>
            <span>Usuarios</span>
          </button>
        </section>
      </aside>

      <section class="stage">
        <section class="stage-head">
          <div>
            <p class="eyebrow">Panel operativo</p>
            <h1 id="moduleTitle">Clientes</h1>
            <p id="moduleDescription"></p>
          </div>
          <div class="metric-row" id="moduleMetrics"></div>
        </section>

        <section class="module-overview">
          <article class="active-module-card">
            <p class="eyebrow">Acciones rapidas</p>
            <div class="action-row" id="moduleActions"></div>
          </article>
          <article class="side-card">
            <div class="panel-title">
              <h2>En curso</h2>
              <span id="activeCount">0</span>
            </div>
            <div class="compact-list" id="activeProcedureList"></div>
          </article>
          <article class="side-card">
            <div class="panel-title">
              <h2>Alertas</h2>
              <span id="alertCount">0</span>
            </div>
            <div class="compact-list" id="requestList"></div>
          </article>
        </section>

        <section class="operations-panel">
          <div class="operations-head">
            <div>
              <p class="eyebrow" id="viewEyebrow">Gestion</p>
              <h2 id="viewTitle">Clientes</h2>
              <p id="viewSubtitle"></p>
            </div>
            <div class="toolbar">
              <label class="search-box">
                <span>Buscar</span>
                <input id="searchInput" type="search" placeholder="Nombre, estado, categoria..." />
              </label>
            </div>
          </div>
          <div class="view-content" id="viewContent"></div>
        </section>
      </section>
    </main>

    <div class="dropdown-layer" id="dropdownLayer" aria-hidden="true">
      <div class="dropdown-panel" id="dropdownPanel"></div>
    </div>

    <div class="modal-backdrop" id="reasonModal" aria-hidden="true">
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reasonTitle">
        <form id="inventoryReasonForm" autocomplete="off">
          <div class="modal-head">
            <div>
              <p class="eyebrow">Validacion de inventario</p>
              <h2 id="reasonTitle">Motivo de salida</h2>
            </div>
            <button class="mini-button" type="button" id="reasonCancelButton">Cerrar</button>
          </div>

          <p class="modal-product" id="reasonProductName"></p>

          <label class="field full">
            <span>Motivo</span>
            <textarea
              id="reasonText"
              name="reason"
              placeholder="Escriba el motivo de uso del producto..."
              required
            ></textarea>
          </label>

          <div class="modal-foot">
            <span id="reasonWordCount">0/100 palabras</span>
            <div class="inline-actions">
              <button class="secondary-action" type="button" id="reasonSecondaryCancelButton">Cancelar</button>
              <button class="primary-action" type="submit">Validar salida</button>
            </div>
          </div>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
    <script src="backend-client.js"></script>
    <script src="enhancements.js"></script>
  </body>
</html>
